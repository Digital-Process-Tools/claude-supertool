name: slow tests

# #891: `slow` is excluded from the main `tests` workflow's twelve legs (see
# .github/workflows/tests.yml) so a full-duration timeout/hang/disclosure
# test does not run on every push. Excluding it from CI entirely would mean
# these tests run *nowhere* — they are this repo's most-filed defect class —
# so this workflow keeps them running, just less often than every push. On a
# cron rather than per-push: the whole point of #891 was to take these tests
# off the per-push critical path, and a per-push run here would put them
# right back.

on:
  schedule:
    # 06:00 UTC daily. No particular significance to the hour — anything
    # that runs at least once a day catches a regression before it has been
    # live a week.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Read-only: this job runs tests and publishes nothing. Declared rather than
# inherited, because the repository default is what a future settings change
# would silently widen.
#
# `pull-requests: read` is #1568's, and it is the whole grant: the one `slow`
# test that reaches GitHub calls `gh pr list` against this repository, which is
# public, so the token buys authentication rather than access. It cannot write,
# comment, merge, tag or release, and it expires when the job ends. Named here
# rather than left to the repository default for the reason the paragraph above
# gives — a settings change would otherwise widen it without touching this file.
permissions:
  contents: read
  pull-requests: read

jobs:
  slow:
    name: pytest -m slow (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    # Sized like the main pytest job's floor
    # (tests/test_ci_job_timeouts_722.py MIN_BUDGET_MIN["pytest"] = 20)
    # rather than tightly: this is a hang-guard, not a benchmark, and firing
    # on a slow runner instead of a real hang is the #702 trade repeated
    # here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install supertool + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run slow tests
        # -n auto: these tests are individually heavy, not numerous, so
        # parallelism still helps. --no-cov: this job measures nothing about
        # coverage, only whether the disclosure paths still pass.
        #
        # GH_TOKEN is #1568. `tests/test_watch_radar_gh_prs_859.py::
        # test_live_board_over_this_repo` is the suite's only live GitHub call
        # and it is `slow`, so this job is the only place it is selected.
        # Without a token `gh` exits 4 before making a request, the test skips
        # countably, and `slow` would mean `nowhere` — which is exactly what
        # this workflow's header exists to refuse. With it the test runs once a
        # day on one leg, off the per-push critical path, where a rate limit
        # cannot red anybody's diff.
        #
        # NOT set on the twelve pytest legs in tests.yml, deliberately. That
        # would put a live API call back on the per-push path (#1568's whole
        # complaint), hand a credential to the environment of ~12,400 tests and
        # the ~900 subprocesses they spawn, and buy nothing: the response is a
        # JSON payload, identical on ubuntu, macOS and Windows, so twelve legs
        # answer the same question twelve times. It also sits against #1341,
        # whose autouse fixture refuses non-loopback sockets for every test and
        # which conftest documents a subprocess as ESCAPING rather than as
        # being permitted.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 -m pytest -m 'slow' -n auto --tb=short --no-cov --durations=25 -q
