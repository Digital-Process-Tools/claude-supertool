name: tests

on:
  push:
    branches: [master]
  pull_request:

# One run per ref, and a new one cancels the run it supersedes (#2223).
#
# A maintainer tick merges the ready board one pull request at a time, so eight
# squashes in twenty minutes is a normal tick and not a bad day. Without this,
# each squash queued its own sixteen-leg matrix: six were queued at once on
# 2026-09-03, and the run for the head anyone wanted an answer about had started
# no leg seventeen minutes after its merge, sitting behind five runs about
# commits nobody will ever read.
#
# On `pull_request` this costs nothing -- a force-push makes the older run
# worthless by construction. On `push: master` it is a real trade: a squashed
# commit can end with no run of its own, which loses the ability to bisect a red
# to the merge that caused it. Taken deliberately, because nothing here reads a
# per-commit historical green (`gh-branch` asks whether master is green *now*)
# and #1257 already says a tally predating later merges is not trustworthy.
#
# The group keys on `github.ref`, so master cancels only master and a pull
# request never kills master's run. `tests/test_ci_concurrency_2223.py` pins it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing in this workflow publishes, comments, or uses a secret —
# the jobs check out, install, and run tests. Declared rather than inherited,
# because what is inherited is the repository default, and a settings change
# would widen it here without touching this file (#877). Same two lines, same
# reasoning, as slow-tests.yml.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    # #722: a job with no budget runs to GitHub's six-hour default, and the
    # whole time the board reads `pending` — which is exactly what a leg about
    # to finish looks like. 30 minutes is sized from 70 job observations across
    # five master runs *as of #722*: windows 483-574s, macos 128-197s, ubuntu
    # 93-125s. Those are a record of a measurement, not a claim about today —
    # five green master runs on 2026-08-09 put windows at 269-481s — and the
    # date is here because the notifiers comment further down carries the
    # current figures and two undated ranges for the same quantity read as a
    # contradiction. The live claim is the multiple, and it survives both: 30
    # minutes is 3.1x the worst windows leg ever measured here, so it can only
    # fire for a hang, not for a slow runner — the #702 trade, in CI config.
    # Deliberately
    # not the same number as `notifiers` below (47-70s as of 2026-08-20; 24-37s
    # when this line was written): one figure across two job classes an order of
    # magnitude apart is no guard on the smaller one.
    # Per-OS budgets inside this matrix were considered and declined — bounding
    # ubuntu at 15 instead of 30 is noise against the 360 it replaces, and it is
    # three numbers to keep in step instead of one. Pinned by
    # `tests/test_ci_job_timeouts_722.py`.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Four versions on all three OSes, including Windows, and that is a
        # measured decision rather than the default (#917). Dropping Windows
        # to 3.9 + 3.12 looks like it removes two 300s legs; it removes ~0s
        # of *critical path*, because the path is the slowest leg and the
        # retained Windows legs run the same length. Replayed over the five
        # green master runs of 2026-08-09 it saves 0s in four of them, and
        # 142s in the fifth only because windows/3.11 happened to be that
        # run's variance outlier — a coin flip among four legs, not a
        # property of the matrix. #917's own filed data says the same: legs
        # of 691/678/675/636s, drop the middle two, `max` is still 691.
        # The saving is real but it is in *billed* minutes at Windows' 2x,
        # which is a different currency from the wall clock the issue's
        # title claims. Against that: Windows-only reds caught here run 10
        # genuine to 2 flakes, and #1004/#1005/#997 were three real
        # Windows-only defects in one evening, each from an agent whose
        # macOS suite was green. Coverage is the expensive thing to give
        # back and this trade buys nothing to give it back for.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      # The exact CPython patch `setup-python` resolves `3.9` to on the hosted
      # runners today, and the single place it is written: the tool-cache path
      # and the cache key below are both derived from it, and the disclosure
      # step checks the interpreter that actually ran against it. Two literals
      # that must agree is a bug waiting for the day one of them is edited.
      WIN_PY39_PATCH: "3.9.13"
    steps:
      # Every third-party action here is pinned to a commit sha rather than to
      # `@v7` (#925). A major tag is repointed by its publisher on every patch
      # release, so the code running with this workflow's token could change
      # between two runs of the same commit -- which is how the
      # tj-actions/changed-files compromise reached its downstreams. The
      # trailing `# vX.Y.Z` is what makes the pin readable, and is what
      # Dependabot rewrites when it bumps one. Pinned by
      # `tests/test_ci_action_pinning_925.py`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Restore the CPython ${{ env.WIN_PY39_PATCH }} tool cache (#1127)
        # CPython 3.9 has left the `windows-latest` image, so `setup-python`
        # reports `Version 3.9 was not found in the local cache` and downloads
        # and installs it. Measured across the five most recent green master
        # runs (2026-08-09), `Set up Python` on that leg: 48/46/48/52/47s,
        # median 48s, against ~4s on its 3.10/3.11/3.12 siblings, whose
        # interpreters are baked into the image.
        #
        # Restoring the hosted tool cache is the whole fix: `setup-python`
        # finds the tree and skips the download entirely.
        #
        # The cached path is the VERSION directory, not `.../x64` beneath it.
        # `@actions/tool-cache` records an installed tool by writing a sibling
        # marker `x64.complete` next to `x64/`, and its `find()` returns a miss
        # when that marker is absent — so caching only `x64/` restores a tree
        # `setup-python` then ignores, and every run is a cache HIT that saves
        # nothing. #1127's ready-to-run note proposed exactly that path.
        #
        # Windows-only and 3.9-only on purpose. The other three Windows legs
        # pay ~4s, and macOS pays 20-32s for 3.9 but is never the critical path
        # (223-258s against Windows' 327-481s across those same five runs), so
        # caching there buys billed minutes and no wall clock.
        #
        # A cache written on a PR branch is visible only to that branch: the
        # `push: [master]` run is what populates the key every other branch
        # restores from, so the first PR after this lands may still miss. The
        # disclosure step below says which happened rather than leaving it to
        # be inferred from a step duration.
        id: toolcache-39
        if: runner.os == 'Windows' && matrix.python-version == '3.9'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ env.WIN_PY39_PATCH }}
          key: ${{ runner.os }}-${{ runner.arch }}-toolcache-python-${{ env.WIN_PY39_PATCH }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Tool cache state (#1127)
        # Three states, never a silent one. `cache-hit: true` on its own is not
        # evidence the cache did anything: `WIN_PY39_PATCH` is a literal, and if
        # `setup-python` ever resolves `3.9` to a different patch, the step above
        # would restore — and then re-save — a directory nothing reads. A
        # permanent HIT sitting next to a permanent 48s download is this repo's
        # most-filed defect exactly (an absence produced by the tool, read as an
        # absence in the world), so the check is against the interpreter that
        # actually ran and not against the cache action's own opinion of itself.
        #
        # `::error::` annotates the run summary without failing the step. A
        # runner-image change is not the fault of whoever pushes next, and a red
        # row here would mean "someone else's PR is broken" — the trade the
        # `ruff` comment below already refuses. Loud, not blocking.
        #
        # NOT `always()`, and not for tidiness: GitHub runs `bash` with
        # `set -eo pipefail`, so if the step above failed there is no `python`
        # on PATH, the command substitution below exits non-zero, and the leg
        # reddens a second time under a heading about a cache. A step that
        # cannot run is not a finding — and an interpreter this cannot read is
        # reported as `skipped`, not as a stale pin, for the same reason.
        if: runner.os == 'Windows'
        shell: bash
        env:
          PY_VERSION: ${{ matrix.python-version }}
          CACHE_HIT: ${{ steps.toolcache-39.outputs.cache-hit }}
        run: |
          if [ "$PY_VERSION" != "3.9" ]; then
            echo "toolcache   : skipped     (CPython $PY_VERSION is baked into the windows-latest image; only 3.9 is missing from it)"
            exit 0
          fi
          resolved=$(python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))" || true)
          if [ -z "$resolved" ]; then
            echo "toolcache   : skipped     (could not read the interpreter version — this says nothing about the cache either way)"
            exit 0
          fi
          if [ "$resolved" != "$WIN_PY39_PATCH" ]; then
            echo "::error::toolcache stale pin - this workflow caches CPython $WIN_PY39_PATCH but setup-python resolved $resolved, so the restore can never be read. Set WIN_PY39_PATCH to $resolved in .github/workflows/tests.yml."
            echo "toolcache   : finding     (stale pin: cached $WIN_PY39_PATCH, running $resolved — the restore is dead weight)"
            echo "  fix       set WIN_PY39_PATCH to $resolved in .github/workflows/tests.yml"
            exit 0
          fi
          if [ "$CACHE_HIT" = "true" ]; then
            echo "toolcache   : ok          (hit — CPython $resolved restored, no download)"
          else
            echo "toolcache   : miss        (CPython $resolved downloaded; the tool cache is saved at job end, for the next run)"
          fi
      - name: Install supertool + test deps (pip entry point — cross-platform, no symlink)
        # `ruff` (via the `dev` extra) is here so `tests/test_validators_ruff.py`
        # runs its ruff-present half instead of skipping into a green that
        # proves nothing. It is NOT a lint gate: there is deliberately no
        # `ruff check .` step in this workflow. A gate reds someone else's
        # unrelated PR the first time the linter ships a new rule inside a
        # category we select, and that cost is paid by whoever happens to push
        # next rather than by whoever caused it. The validator registered in
        # `.supertool.json` reports a finding to the person who wrote it, at
        # the moment they wrote it, which is where the feedback belongs.
        # Revisit if there is ever a reason to pin one ruff version repo-wide.
        #
        # Installing from `.[dev]` rather than a hand-typed package list is
        # also what makes `cache-dependency-path: pyproject.toml` above an
        # honest cache key (#890): the cache is keyed on the file that
        # actually drives what gets installed, so it invalidates exactly when
        # the real dependency set changes — a hand-typed list here could drift
        # from `[project.optional-dependencies] dev` unnoticed and leave the
        # cache stale.
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      # Defender's real-time scanner walks every file this job touches on the runner's
      # own disk -- and the suites create many small temp files per assertion (each
      # `mktemp` fixture, each rewritten .claude/jit-context/ under test). This is a
      # documented GitHub Actions cost specific to windows-latest: macOS and Linux
      # runners carry no equivalent always-on scanner. Excluding the checkout and the
      # runner temp directory removes that tax without touching what any suite tests --
      # it changes nothing about correctness, only how fast the disk answers.
      #
      # continue-on-error, deliberately (#2259): Add-MpPreference has been
      # observed to fail hard (0x800106ba) when the Defender service is
      # unavailable/disabled on a given runner instance -- infrastructure this
      # workflow does not control. This step is pure disk-cost optimisation
      # and is not correctness-bearing, so failing open (slower green) is the
      # right default. Do not remove continue-on-error here without reading
      # #2259 first: without it, a Defender hiccup on the runner takes the
      # whole pytest job down before a single test runs, and the resulting
      # red reads exactly like a real regression.
      - name: Exclude the checkout and temp dir from Windows Defender scanning
        id: defender-exclusion
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      # continue-on-error above only changes the step's *conclusion* as read
      # back through the jobs API -- it does not surface anywhere that a
      # person skimming a slow run, or a tool reading job/step conclusions
      # after the fact, would notice. This step makes the tolerated failure
      # visible: a `::warning::` annotation shows in the Actions UI's
      # Annotations panel and in the raw log regardless of which surface
      # someone is looking at (#2259).
      - name: Warn if the Defender exclusion step failed
        if: steps.defender-exclusion.outcome == 'failure'
        shell: pwsh
        run: |
          echo "::warning::Windows Defender exclusion step failed (Add-MpPreference) -- continuing without it; this Windows run may be slower than usual, see #2259"
      - name: Ensure awk is on PATH (Windows) (#2505)
        # `tests/test_jit_no_cut_word_boundary_2257.py`,
        # `tests/test_jit_no_cut_span_stops_at_a_separator_1565.py` and
        # `tests/test_jit_no_cut_path_name_1221.py` shell out to a real `awk`
        # to reproduce exactly what `pre-tool-hook.sh` compiles the
        # `supertool-no-cut` jit-context rule with -- awk, not Python `re`;
        # the two dialects disagree on some escapes (docs/validators.md).
        # Losing `awk` does not fail a leg: `needs_awk` skips the whole file,
        # positive controls included, and a green run then reads identical
        # whether every regression ran or none of them did (#2505).
        #
        # `shell: bash` on "Run tests" below already runs under Git Bash,
        # whose MSYS2 runtime is documented to prepend its own `usr/bin`
        # (where `awk.exe` ships) to PATH independently of
        # `--noprofile`/`--norc` -- but that could not be confirmed against a
        # live `windows-latest` job while this step was written (GitHub API
        # rate-limited during development; see #2505's PR body for what was
        # and was not checked). So this step makes the guarantee explicit
        # and checked rather than assumed: it fails the job loudly, with a
        # named cause, rather than letting three files' worth of regression
        # coverage silently not run. `tests/test_jit_no_cut_awk_present_2505.py`
        # is the matching in-suite check, which reads this exact failure
        # mode back out of `CI`/`PATH` on whichever leg runs it.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v awk >/dev/null 2>&1; then
            printf '%s\n' "C:\Program Files\Git\usr\bin" >> "$GITHUB_PATH"
            export PATH="/c/Program Files/Git/usr/bin:$PATH"
            if ! command -v awk >/dev/null 2>&1; then
              echo "::error::awk not found on PATH even after adding Git's usr/bin -- tests/test_jit_no_cut_*.py will silently skip their positive controls on this leg (#2505)"
              exit 1
            fi
          fi
          echo "awk resolved to: $(command -v awk)"
      - name: Print xdist worker sizing (#2345)
        # `pyproject.toml`'s `addopts` carries `-n auto`, and the step below
        # runs on all twelve legs with a worker count nobody has read.
        # `.github/scripts/print_worker_sizing.py` walks xdist's own
        # resolution order (env var, `psutil.cpu_count(logical=False)`,
        # `os.sched_getaffinity(0)`, `os.cpu_count()`) and names which source
        # answered -- the one thing the real "N workers" banner on the step
        # below cannot say, which matters because a transitive dependency
        # pulling in `psutil` silently changes physical-vs-logical core
        # counting with no other visible cause. Report only, and the script
        # itself catches everything it can raise -- `continue-on-error`
        # is a second, independent layer, the same pattern already used a
        # few steps up for the Windows Defender exclusion (#2259): a step
        # with no correctness stake must fail open, not take the job with it.
        continue-on-error: true
        shell: bash
        run: python .github/scripts/print_worker_sizing.py
      - name: Run tests (excludes slow and benchmark — see #891)
        # Override pyproject addopts default. Until #891 this ran the `slow`
        # marker on all twelve legs, on every push — marking a test `slow`
        # changed the local inner loop and nothing else. `slow` is excluded
        # here too now, same as the local default; `benchmark` stays
        # excluded because its wall-clock assertions on a shared runner
        # report on the runner (#485). A red CI row has to mean "this diff
        # is wrong" or it stops being read.
        #
        # `slow` tests still run — on a schedule, in
        # .github/workflows/slow-tests.yml — rather than nowhere: they are
        # timeout/hang/network-failure disclosure tests, this repo's
        # most-filed defect class, and a test that runs nowhere is deleted
        # with extra steps.
        #
        # `--durations=25` (#891 scope item 3) was added to find the Windows
        # tail: ~7 of a Windows leg's then-~10.5 minutes were spent between
        # 98% and 99% of the progress bar with nothing in the log to say
        # which test was running there. **It has answered, and the answer is
        # that there is no tail** — on `pytest (windows-latest, 3.9)` of run
        # 31329647265 the whole suite is `8912 passed, 746 skipped in
        # 275.87s`, the slowest single test is 8.9s, and the entire top-25
        # sums to 116s of per-test time under `-n auto`. The Windows premium
        # is broad per-spawn overhead across ~8900 tests, not a hot spot, so
        # nothing here can be fixed by finding "the slow tests" (#917's
        # spawn census, and why #1125 rather than a test rewrite).
        #
        # The flag stays anyway, and not out of inertia: it is the standing
        # evidence for that negative. Removing it would leave the next agent
        # with no way to tell "no test is slow" from "nobody looked", which
        # is the reading it was added to close.
        #
        # bash shell forced so `|| true` works on Windows (PowerShell default
        # exits on pytest's non-zero status, skipping the junit-xml parser).
        # The Python step parses junit-xml and re-emits the failures with their
        # full messages — survives the GH 64KB log truncation that would
        # otherwise eat the pytest summary block.
        #
        # `-X utf8` and NOT `env: PYTHONUTF8` / `PYTHONIOENCODING` (#546). The
        # emitter that mangles a Windows failure message is pytest's own
        # terminal writer, attached to a stream whose codec is the runner's
        # console codepage — an em dash is not in cp437, so it left the process
        # as U+FFFD, destroyed rather than mangled in transit. UTF-8 mode fixes
        # that emitter and nothing else: `-X` is a flag on this interpreter and
        # is not inherited by child processes, whereas either env var is
        # inherited by every subprocess the suite spawns — including
        # `tests/test_encoding_seam.py` and
        # `tests/test_git_commit_payload_route.py`, which reproduce Windows
        # encoding defects precisely by leaving the environment alone. A fix
        # whose blast radius includes the tests that would catch its own
        # regression is not a fix. Pinned by `tests/test_ci_encoding_546.py`.
        # No `-q` (#2345): `-q` suppresses xdist's own "N workers [M items]"
        # banner along with the platform/rootdir/plugins header -- confirmed
        # locally, same invocation as this line minus the interpreter flag,
        # junit-xml and all: the banner prints without `-q` and is gone the
        # instant `-q` is added. The issue's own "worth checking" note says
        # the fix is smaller than it assumes if that is true. It is: the
        # delta is a fixed ~6-line header, not one that scales with this
        # suite's ~16.5k tests, and nothing in this repo parses this step's
        # raw stdout downstream -- `junit_summary.py` and
        # `duration_report.py` both read junit.xml, never this stream.
        # Dropping `-q` prints the worker count xdist actually resolved to,
        # on every leg, for free -- a real measurement rather than a
        # re-derivation of xdist's own resolution logic that could drift
        # from it (the step above measures the same thing from the outside,
        # and names *which* source answered, which this banner cannot say).
        # #2360: `invariant`-marked tests (tree-walking guards over this repo's
        # own tree, `tests/_invariant_census.py`) are deselected on every leg
        # except one designated full leg -- (ubuntu-latest, 3.12), the same
        # leg the durations census in #2360 was measured against. One `-m`
        # expression built by a single script-level `if`, never two
        # independently-guarded steps or two ternaries on one step: #2360
        # names exactly that shape (two `${{ }}` conditions, both false, is a
        # leg that silently runs no tests) as claude-oss's own first mistake
        # on this feature.
        #
        # #2372 corrected the claim previously made here, which had the
        # failure direction backwards. An unset MATRIX_OS/MATRIX_PY compares
        # against the empty string, `"" != "ubuntu-latest"` is true, and the
        # EXCLUSION branch runs -- not the "no exclusion" default arm the old
        # comment named. Worse, if `ubuntu-latest` or `3.12` is ever repinned
        # in the matrix above without updating the two literals in the `if`
        # below, EVERY leg (including whichever was meant to be the one full
        # run) decides it is not the designated leg and applies the
        # exclusion -- zero of twelve legs then run the invariant
        # population, silently, with no leg left to notice from. That is the
        # opposite of "every leg runs the invariant population": it is every
        # leg deselecting it. `tests/test_ci_invariant_exclusion_repin_2372.py`
        # pins the two literals below against the matrix's own `os:` and
        # `python-version:` lists so a repin breaks this file loudly instead.
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PY: ${{ matrix.python-version }}
        run: |
          MARKER="not slow and not benchmark"
          if [ "$MATRIX_OS" != "ubuntu-latest" ] || [ "$MATRIX_PY" != "3.12" ]; then
            MARKER="$MARKER and not invariant"
          fi
          python -X utf8 -m pytest -m "$MARKER" --tb=no --no-cov --durations=25 --junit-xml=junit.xml
      - name: Show failing tests with full messages (always runs)
        # `--tb=no` above means the one-line summary is all there is, and pytest
        # elides the middle of a long one to fit the terminal width — on one real
        # Windows failure the elided part held the word `timeout`, which was the
        # diagnosis. junit.xml carries the untruncated message and is written as
        # UTF-8 whatever the console can encode, so it is the readable channel.
        # The script pins its own stdout to UTF-8 in-process; no `||` fallback,
        # because the one it replaced reported "pytest crashed before generating
        # it" for a reporter that had merely failed to print.
        if: always()
        shell: bash
        run: python .github/scripts/junit_summary.py junit.xml
      - name: Suite duration report (#2206 — report only, never a gate)
        # `--durations=25` above has printed on every leg since #891 and
        # nothing read it, which is how a test can quietly grow to a large
        # share of a run and the only detector is a person reading a log
        # tail by chance (see the module docstring in duration_report.py for
        # the claude-oss case this issue was filed from). This step reads
        # the same junit.xml the step above does and prints the top
        # durations plus the slowest test's share of the run's real
        # wall-clock, against a baseline this repo does not commit today
        # (.github/duration-baseline.json is not in `git ls-files` -- #2277).
        # Until one lands, this comparison prints its own `no-baseline`
        # state on every run rather than a delta; the path is still passed
        # so the step starts comparing the moment a baseline is committed,
        # with no workflow edit needed.
        #
        # `if: always()`, same reasoning as the step above it: junit.xml can
        # exist with partial data after a failing run, and a report that
        # only ran on green would silently stop answering exactly when
        # something is already wrong.
        #
        # Deliberately no wall-clock threshold that can fail this step or
        # the job — the issue that added this is explicit that a shared
        # runner's load is not in anybody's diff, and a gate here would
        # teach people to re-run until green rather than read the number.
        if: always()
        shell: bash
        run: python .github/scripts/duration_report.py junit.xml --baseline .github/duration-baseline.json
  coverage:
    # #861: the 86% floor lived in `addopts` as `--cov=supertool`, so it
    # measured one file and every op under `presets/` — ~14k statements, the
    # whole `gh-*`/`gl-*`/`git-*`/`watch` surface — had no floor at all. Worse,
    # the twelve legs above pass `--no-cov` and so does `.githooks/pre-push`,
    # deliberately, which means the number was enforced only against a bare
    # local `pytest` while `docs/contributing.md` said it ran on all twelve
    # legs. A floor with no owner is the same shape as no floor.
    #
    # One leg, not twelve. Line coverage of this code is not a per-OS question
    # in any way a floor could act on — the platform-conditional branches are a
    # couple of points either side, and a per-OS floor would be three more
    # numbers to keep in step, which is the trade the `timeout-minutes` comment
    # above already refuses. Twelve coverage runs would buy that and cost twelve
    # times the wall-clock of the slowest thing in this workflow.
    #
    # Deliberately a separate job rather than a flag on the matrix: coverage
    # needs `parallel = true` and `COVERAGE_PROCESS_START` so the 122
    # subprocess-driving test modules are attributed at all (without it
    # `presets/git/diff.py` reads 9% against its own 600-line test module, and
    # the real figure is 83.7%). That environment is exactly what
    # `tests/test_encoding_seam.py` and `tests/test_git_commit_payload_route.py`
    # reproduce Windows defects by *not* having, so it does not belong on the
    # legs that have to run them clean.
    name: coverage (floors + disclosure)
    runs-on: ubuntu-latest
    # 3m24s to 6m04s across four local runs — the spread is contention on the
    # measuring machine, not variance in the work — against ~3m36s for the same
    # suite with no coverage at all. Tracing a 16.8k-line `supertool.py` inside
    # each of ~900 spawned children is what the top of that range buys, and it
    # is the cost of the attribution that makes the number true.
    #
    # #1862: "20 is ~3.3x the worst observed run" was the claim here, and it was
    # ~3.3x the worst *local* run. Measured 2026-08-20 over the 14 most recent
    # successful runs, this job takes 353-528s in CI, so 20 minutes is 2.3x —
    # still a hang-guard rather than a benchmark, but not what the sentence
    # said, and the floor derived from the local number had drifted under the
    # real worst run. Local timings do not size a CI budget; they were the only
    # ones available when this job was added, and nothing went back for the
    # real ones. Sized like the pytest budget above rather than tight, so it
    # fires for a hang and not for a slow runner. Pinned, with the durations
    # themselves, by `tests/test_ci_job_timeouts_722.py`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install supertool + test deps (pip entry point — cross-platform, no symlink)
        # Installing from `.[dev]` is what makes `cache-dependency-path:
        # pyproject.toml` above an honest cache key (#890) — see the pytest
        # job's identical step for the full reasoning.
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      # #2019: no leg installed markdownlint-cli, so the four measurement
      # tests in tests/test_markdownlint_noise_2012.py (the #2012 findings
      # ceiling, its positive control, and the residue-file pin) skipped on
      # every one of the twelve pytest legs and here — and a skip renders
      # identically to a pass on any board that counts red legs. This job,
      # not the pytest matrix, is where it belongs: it is one ubuntu leg off
      # the critical path of the twelve, ubuntu-latest ships npm already, and
      # `Coverage gate` below runs the whole suite (`-m 'not benchmark'`,
      # which includes tests/test_markdownlint_noise_2012.py) rather than a
      # scoped subset, so a single install here reaches every measurement
      # test without adding a node toolchain to a 12-way matrix. Pinned to
      # 0.49.1 — the version this repo's own `.markdownlint.json` rule
      # choices and adapter tests (tests/test_adapter_path_anchor_1940.py,
      # tests/test_validators_scope_is_not_a_verdict_1601.py) were measured
      # against — rather than left to float and drift the ceiling out from
      # under #2012's fix without anyone deciding to.
      - name: Install markdownlint-cli (#2019)
        run: npm install -g markdownlint-cli@0.49.1
      # #2389: no leg installed pyright or mypy, so every test in
      # tests/test_pyright.py and tests/test_mypy.py that exercises the
      # adapters end to end (argv-containment of a flag-shaped target, the
      # `--` separator mypy's own adapter relies on) skipped on all twelve
      # pytest legs, on this job, and on changelog.yml and slow-tests.yml
      # alike — a skip that renders identically to a genuine pass on any
      # board that counts red legs, for exactly the class of regression
      # those tests exist to catch (#2379 fixed one such argv-containment
      # bug and its own self-review is what surfaced this gap). One ubuntu
      # leg, same reasoning as the markdownlint-cli step above: this job is
      # off the critical path of the twelve, and `Coverage gate` below runs
      # the whole suite (`-m 'not benchmark'`, which includes both files)
      # rather than a scoped subset, so a single install here reaches every
      # skipped assertion without adding either tool to a 12-way matrix.
      # `pip install` for both — pyright's PyPI wheel (pyright-python)
      # depends on `nodeenv`, which reuses a compatible Node already on
      # PATH or downloads and builds one on first run, so it needs no
      # separate `npm install` step the way markdownlint-cli (a Node-only
      # package with no PyPI wrapper) does. `ubuntu-latest` ships Node
      # already, same as the markdownlint-cli step relies on.
      # Unpinned versions, deliberately: unlike markdownlint-cli, neither
      # adapter (`validators/pyright/pyright.py`,
      # `validators/mypy/mypy.py`) asserts against a specific tool version
      # or a fixed set of findings from either checker — they test their own
      # argv construction and output parsing, which is stable across
      # releases of the underlying tool.
      - name: Install pyright and mypy (#2389)
        run: pip install pyright mypy
      # The script prints all three states — enforced, measured-without-a-floor,
      # and not-measured-with-the-reason — on every run, pass or fail. A report
      # that silently omits a directory is the defect being fixed here, and it
      # must not survive in a new form.
      - name: Coverage gate
        run: python -X utf8 .github/scripts/coverage_gate.py
  lint-new:
    # #1481: an error that arrives already-dead is invisible to both existing
    # lint gates at once. The pytest job deliberately runs no `ruff check .` —
    # the comment on its install step says why, and this job does not reverse
    # it — and the supertool `ruff` validator reports only what an edit
    # *introduces*, which a file arriving whole cannot do. PR #1473 merged
    # 22/22 green with three unreachable imports in a file it created, every
    # edit to which reported `ruff : ok (no new errors)`.
    #
    # Scoped to the diff, never the tree, in two halves. A path this PR adds,
    # copies or renames has no history, so "pre-existing" is not a category it
    # can be in and it is checked whole. A path this PR *modifies* has a
    # history and a share of the 263 findings the tree-wide ignore holds back,
    # so it is checked only against its own merge-base revision: a finding
    # already there is not reported. Either way a new rule in a ruff release
    # reds only a PR already touching the file, which is the cost the pytest
    # job's comment refuses to socialise onto whoever pushes next.
    #
    # The second half is #1849, and it was a hole in this job rather than an
    # extension of it. Measured on PR #1843: this leg reported one finding, in
    # the only file that PR adds; the same rule set over the whole diff found
    # five. The other four were in modified files -- hidden by the tree-wide
    # ignore locally and by the ACR scope here, simultaneously -- and would
    # have shipped. Whole-file linting of modified paths is NOT the fix: it
    # re-surfaces the 263 and the leg goes permanently red.
    name: lint (files this PR adds, renames or modifies)
    runs-on: ubuntu-latest
    # Now sized from this job's own observations, which is what the previous
    # comment here asked for and could not do: it said "this job has never
    # run" and took the `notifiers` budget by analogy, and that sentence went
    # stale the first time the job ran without anybody noticing — a number
    # carried over from a different job class is exactly what #702 was filed
    # about, and so is a justification that outlives its evidence.
    #
    # Measured 2026-08-20 over the 12 most recent successful `tests` runs:
    # 13-33s, median ~17s. #1849 adds a second ruff pass over the modified
    # files, worth ~7s on a 443-file diff (443 changed .py, 231 of them
    # modified, measured locally over 200 commits of master) and nothing at
    # all on the one- to twenty-file diffs that are the normal case.
    #
    # The budget stays at 10 minutes rather than being tightened to fit: the
    # spread above is a checkout and a pip install, both of which depend on a
    # cache that can miss and a network that can be slow, and the cost of this
    # number being too small is a red leg on a PR that is fine. It is a
    # runaway bound, not a performance target.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The gate diffs against the PR's base. `actions/checkout` defaults
          # to depth 1, under which `origin/<base>` does not resolve — and an
          # unresolvable base yields an empty file list, which reads exactly
          # like a clean one. The script declines rather than passing there
          # (exit 2), so this line is belt to that braces, not the only thing
          # standing between a shallow clone and a false green.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff (the same one the dev extra pins)
        # `.[dev]` rather than a hand-typed `pip install ruff`, for the reason
        # #890 gives on the two jobs above: the cache key is `pyproject.toml`,
        # so what gets installed has to be what that file declares. It also
        # keeps this gate and the post-edit validator on one linter version
        # instead of two that drift.
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint the files this PR touches
        # Three states on every run, pass or fail — `ok`, `finding`, `declined`
        # — because "nothing to report" and "I could not look" print the same
        # way otherwise, and that equivalence is the whole of #1481.
        #
        # The report states both scopes in full on every run. `1 of 1 file(s)
        # this PR adds, copies or renames` was accurate and was read, by two
        # people in one session, as `1 of 1 file(s) in this PR` — a whole-diff
        # verdict the leg had never formed (#1849).
        run: python -X utf8 .github/scripts/lint_new_files.py
  notifiers:
    # #557: the matrix above runs pytest and nothing else, so
    # `notifiers/claude-channel/` — TypeScript, started in every radar session —
    # shipped on a 12/12 green that had never executed a line of it. Its tests
    # exist and are real (they spawn the server over a socket and assert on the
    # emitted JSON-RPC); they were being collected, skipped for want of bun, and
    # counted as neither a pass nor a failure.
    #
    # Not on windows-latest, and that is a decision, not an omission: channel.ts
    # binds an AF_UNIX socket, which those legs do not have, so no toolchain
    # install would make these tests run there. A Windows leg here would be
    # theatre. macOS is in because this exact code has already produced a
    # macOS-specific defect — the ~104-byte `sun_path` cap, which is why the
    # #554 harness pins /tmp instead of tmp_path.
    #
    # Runs in parallel with the twelve pytest legs and finishes well inside
    # them — 43-52s against a 327-481s critical path across the five most
    # recent green master runs (2026-08-09) — so the board's wall-clock does
    # not move. The figure that stood here, `windows-latest/3.9 at ~193s`, was
    # stale by a factor of two and named a leg that leads the board in only
    # four runs of those five; windows/3.11 led the fifth at 481s. The claim
    # this comment makes survives either number, which is why it is written as
    # a range rather than as the one leg that happened to be slowest.
    name: notifiers (bun + TypeScript)
    runs-on: ${{ matrix.os }}
    # #722: this is the job that hung — 26 minutes and still running on PR #715,
    # against 24-37s on every one of the last five master runs, stuck on the
    # channel integration step while its macOS twin passed in 32s. 10 minutes is
    # ~8.6x the worst observed run of the whole job — it said ~16x until #1862,
    # against the 37s above; re-measured 2026-08-20 over the 14 most recent
    # successful runs this job takes 47-70s, so the base roughly doubled and
    # nothing recomputed the multiple. The claim the multiple exists to make
    # survives at 8.6x and the arithmetic did not. The multiple is large on
    # purpose and the base is why: three of these steps are package-manager
    # installs (npm, pip, bun) whose tail latency against a degraded registry is
    # minutes rather than seconds, so a tight multiple of 37s would fire on a bad
    # network day and teach everyone to press re-run.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Bun is installed from npm rather than via `oven-sh/setup-bun`, so this
      # adds no third-party action at all — the runners already ship npm. Pinned,
      # because `@v2` with `bun-version: latest` pinned neither side: a moving tag
      # runs whatever code it points at today with this workflow's token, and a
      # floating runtime turns an upstream release into a red leg nobody caused.
      #
      # Bun here, node in the shipped path -- and that split is now the fact
      # to know, not the decision this comment used to describe. #520 switched
      # the documented install path (install.sh, .mcp.json, package.json) to
      # `"command": "node"`; this job still type-checks and runs most of
      # channel.ts's own contract under bun, which this comment used to justify
      # by saying bun was the runtime users were told to install -- no longer
      # true. It stays anyway: this job's own frozen-lockfile install and cache
      # key below are keyed on bun.lock, and tests/test_ci_non_python_coverage_557.py
      # and tests/test_ci_pip_cache_890.py assert on this job's literal
      # structure, so swapping it for node wholesale is a separate, larger
      # change than #520's own scope (see that issue's PR for the reasoning).
      #
      # #2469 closed the resulting gap narrowly rather than converting the
      # job: bun and node agree on most of channel.ts's behavior but disagree
      # on the errno for the same dead socket (node `ECONNREFUSED`, bun
      # `ENOENT`, the divergence #550 was about, handled by channel.ts's own
      # code, not this job) -- so a "Run channel.ts under node for real" step
      # below installs node 22 and spawns the exact command the shipped config
      # now uses, real subprocess and all, rather than only type-checking it.
      - name: Install bun
        run: npm i -g bun@1.3.14
      - name: Install supertool + test deps (pip entry point — cross-platform, no symlink)
        # Installing from `.[dev]` is what makes `cache-dependency-path:
        # pyproject.toml` above an honest cache key (#890) — see the pytest
        # job's identical step for the full reasoning. `ruff` comes along for
        # free here; it costs one extra wheel and buys not having a third
        # variant of this install line to keep in sync.
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      # Bun's own install cache (#890): `bun install --frozen-lockfile` below
      # reads a real, committed lockfile, so keying on its hash is honest the
      # same way the pip cache above is — the key changes exactly when the
      # locked dependency set does.
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('notifiers/claude-channel/bun.lock') }}
      - name: Install channel deps
        working-directory: notifiers/claude-channel
        run: bun install --frozen-lockfile
      - name: Type-check channel.ts
        # `tsconfig.json` already declares noEmit; -p . uses the repo's own
        # strict settings rather than a looser CLI default.
        working-directory: notifiers/claude-channel
        run: bunx tsc --noEmit -p .
      - name: Run the channel integration tests for real
        # SUPERTOOL_REQUIRE_JS=1 makes a missing prerequisite a collection error
        # instead of a skip, so this step cannot pass by skipping — which is the
        # only way it is worth adding. See tests/_toolchain_gate.py.
        #
        # Every test_notifiers_claude_channel_*.py file that is meant to run
        # under bun must be named here -- since #2469, this is no longer the
        # only place any of them run at all: the node step below runs its own
        # file under `node --experimental-strip-types`. On every other leg
        # (the 12-leg matrix installs no bun) they skip via `require_or_skip`,
        # silently and by design. #605 and #609 landed without being added
        # here and their own tests had therefore never executed in CI since —
        # a green board that meant nothing, caught while wiring #612's test in
        # (which would have inherited the same
        # gap). Add the file the moment it exists, not when someone notices.
        #
        # -n0 because eleven tests that each spawn a server gain nothing from
        # xdist and lose determinism to it. --no-cov because pyproject's addopts
        # carry a whole-suite 86% gate that two files cannot meet.
        #
        # `--timeout=30` (#722) is the inner half of the guard, and it is the
        # half that produces evidence. The job ceiling above can only ever say
        # "this leg did not finish"; pytest-timeout names the test and dumps the
        # stack of the thread stuck in it, which is the artefact #554 needs to
        # find out why a socket wait never returns. pytest-timeout has been in
        # the dev extras and installed by both jobs since it was added, and used
        # by neither. 30s is ~85x the ~0.35s these ~30 tests average (10-11s for
        # the step, measured across five master runs) and well under the job
        # ceiling, so the inner guard always fires first — the ordering
        # `tests/_adapter_budget.py` insists on, here between a step and its job.
        env:
          SUPERTOOL_REQUIRE_JS: "1"
        run: >-
          python -X utf8 -m pytest -n0 --no-cov -q --timeout=30
          tests/test_notifiers_claude_channel_550.py
          tests/test_notifiers_claude_channel_554.py
          tests/test_notifiers_claude_channel_health_554.py
          tests/test_notifiers_claude_channel_605.py
          tests/test_notifiers_claude_channel_605_burst.py
          tests/test_notifiers_claude_channel_609.py
          tests/test_notifiers_claude_channel_612.py
          tests/test_notifiers_claude_channel_name_1477.py
      # #2469: the runner images ship a node, but not reliably one recent
      # enough for `--experimental-strip-types` (added in 22.6.0) -- pinning
      # the version here is what makes the step below test the flag real
      # users run rather than whatever LTS happened to be preinstalled.
      - name: Install node 22 (channel.ts's own shipped runtime)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Run channel.ts under node for real
        # The exact command `.mcp.json` / `start.mjs` launch (#520, #2486),
        # spawned for real rather than only type-checked -- see the comment
        # above "Install bun" for why this is a step here and not a second
        # job. SUPERTOOL_REQUIRE_JS=1 for the same reason as the bun step:
        # a missing prerequisite must be a collection error, not a skip that
        # reports a pass for a file that never ran (#557,
        # tests/_toolchain_gate.py). channel_deps installed by the bun step
        # above are plain node_modules -- nothing here re-installs them.
        env:
          SUPERTOOL_REQUIRE_JS: "1"
        run: >-
          python -X utf8 -m pytest -n0 --no-cov -q --timeout=30
          tests/test_notifiers_claude_channel_node_2469.py
