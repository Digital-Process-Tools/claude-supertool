name: changelog

# Deliberately not a job inside `tests.yml`. "Did this PR add a changelog
# fragment" is not a test — it is a policy read of the PR's diff — and putting
# it in its own file also means the file every contributor edits at once is not
# the file this check lives in.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-latest
    # Every job gets a wall-clock budget (#722). Without one GitHub's default
    # ceiling is six hours, which is not a budget, it is an absence of one.
    timeout-minutes: 5
    steps:
      # Full history: the diff is taken against the base branch, and
      # actions/checkout clones at depth 1 by default.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      # The guard is a CommonMark parser now (#936), so this leg has to have
      # one. It did not: this job was `actions/checkout` and a bare `python3`,
      # and the assembler was stdlib-only to match. Without the install the
      # check would report `skipped` on every pull request and exit non-zero —
      # a red leg that pins nothing, which is one step better than a green leg
      # that pins nothing and no more than that. Pinned by
      # `tests/test_changelog_fragment_parser_936.py`.
      - name: Install the CommonMark parser the fragment guard is
        run: python3 -m pip install --disable-pip-version-check markdown-it-py

      # Names must parse before anything else is claimed about them. This is
      # repo-wide, not diff-scoped: a fragment somebody else merged with a bad
      # name is a release that will refuse, and the PR that has to find out is
      # not the one cutting the tag.
      - name: Every fragment name and body parses
        run: python3 .github/scripts/assemble_changelog.py --check

      # Repo-wide and every PR, not at release time. The refs are the surface
      # a release leaves behind rather than one it reads, so the run that finds
      # them stale must not be the run cutting the tag (#918).
      - name: CHANGELOG.md's link refs agree with its release headings
        run: python3 .github/scripts/assemble_changelog.py --check-links

      - name: A user-visible change carries a fragment
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE}...HEAD")
          if [ -z "$changed" ]; then
            echo "changelog   : skipped     (no files changed against origin/${BASE})"
            exit 0
          fi
          case ",${LABELS}," in
            *,no-changelog,*)
              echo "changelog   : skipped     (label 'no-changelog' set on this PR)"
              exit 0 ;;
          esac
          # `--name-only` alone lists a DELETION identically to an addition, so
          # until #925 a PR that *removed* somebody else's pending fragment
          # satisfied this gate: it announced nothing, dropped an
          # already-approved entry from the next release, and went green. The
          # two states have to be read apart, and that is two diffs rather than
          # one flag — restricting the single diff above to `AM` would also
          # stop the `shipped` read below seeing a DELETED preset, and a preset
          # that goes away is as user-visible as one that arrives.
          fragment_re='^changelog\.d/[0-9]+\.[a-z]+.*\.md$'
          added=$(git diff --name-only --diff-filter=AM "origin/${BASE}...HEAD" | grep -E "$fragment_re" || true)
          removed=$(git diff --name-only --diff-filter=D "origin/${BASE}...HEAD" | grep -E "$fragment_re" || true)
          # Deleting fragments is exactly what a release cut does — it folds
          # them into CHANGELOG.md and adds none — so that shape is a pass, and
          # is named as one rather than being waved through the branch below.
          # The test for it is "CHANGELOG.md was rewritten in the same PR",
          # which is a claim about the diff and not a proof the entries
          # survived; the assembler's own entry-balance refusal (#906) is what
          # proves that, and it runs where the file is written.
          assembled=$(printf '%s\n' "$changed" | grep -Fx 'CHANGELOG.md' || true)
          # Deliberately ABOVE the user-visible-paths gate below, and the
          # ordering is the finding rather than a detail. Losing a fragment
          # needs no code change to go with it: `git rm changelog.d/906.added.md`
          # on its own leaves `shipped` empty, and the first cut of this fix
          # therefore reported `skipped (nothing to announce)` and exited 0 on
          # the plainest instance of the very bug it closes. Found by the
          # independent review of that commit. The `no-changelog` label still
          # sits above this, because a label is a human saying "this announces
          # nothing" — which is a claim about what the PR adds, not a licence
          # to remove somebody else's entry, but it stays the single stated
          # escape hatch rather than growing a second one here.
          if [ -n "$removed" ] && [ -z "$assembled" ]; then
            echo "changelog   : finding     (fragment(s) deleted without being assembled into CHANGELOG.md)"
            printf '%s\n' "$removed" | sed 's/^/  deleted   /'
            echo "  fix       restore them — a pending entry is dropped from the next release, silently"
            echo "  or        if this is a release cut, it must also write CHANGELOG.md"
            exit 1
          fi
          # What a user could notice. Docs and tests are excluded on purpose:
          # requiring a fragment for a typo fix is how the discipline decays
          # into a reflex-added empty file.
          shipped=$(printf '%s\n' "$changed" | grep -E '^(_?supertool\.py|presets/|validators/|formatters/|notifiers/|\.claude-plugin/)' || true)
          if [ -z "$shipped" ]; then
            echo "changelog   : skipped     (no user-visible paths changed — nothing to announce)"
            exit 0
          fi
          if [ -z "$added" ]; then
            if [ -n "$removed" ]; then
              echo "changelog   : ok          (release: $(printf '%s\n' "$removed" | wc -l | tr -d ' ') fragment(s) assembled into CHANGELOG.md)"
              printf '%s\n' "$removed" | sed 's/^/  consumed  /'
              exit 0
            fi
            echo "changelog   : finding     (user-visible change with no changelog.d/ fragment)"
            echo "  changed   $(printf '%s\n' "$shipped" | head -5 | tr '\n' ' ')"
            echo "  fix       add changelog.d/<issue>.<section>.md — see docs/contributing.md"
            echo "  or        label the PR 'no-changelog' if it genuinely announces nothing"
            exit 1
          fi
          echo "changelog   : ok          ($(printf '%s\n' "$added" | wc -l | tr -d ' ') fragment(s))"
          printf '%s\n' "$added" | sed 's/^/  /'
          # A PR that adds its own fragment and consumes others is legitimate
          # (a release that also carries an entry) and reached the line above
          # reporting only what it added. The deletions are half of what it
          # did, and a receipt that prints one half is the shape this whole
          # job exists to refuse.
          if [ -n "$removed" ]; then
            printf '%s\n' "$removed" | sed 's/^/  consumed  /'
          fi
