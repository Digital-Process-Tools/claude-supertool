name: changelog

# Deliberately not a job inside `tests.yml`. "Did this PR add a changelog
# fragment" is not a test — it is a policy read of the PR's diff — and putting
# it in its own file also means the file every contributor edits at once is not
# the file this check lives in.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# One run per ref, superseded runs cancelled (#2223). Free here: this fires on
# `synchronize` too, so every force-push during a rebase-and-resolve queued a
# second policy read of a diff that no longer existed. See `tests.yml` for the
# measurement and for why the `push: master` half of the same change is a trade
# rather than a free win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` is the scope the live label read needs (#1722). It is
# named here rather than left to the repository default, so that widening or
# narrowing it is a change to this file. A `pull_request` from a fork gets a
# read-only token, which is all this job asks for.
permissions:
  contents: read
  pull-requests: read

jobs:
  fragment:
    runs-on: ubuntu-latest
    # Every job gets a wall-clock budget (#722). Without one GitHub's default
    # ceiling is six hours, which is not a budget, it is an absence of one.
    timeout-minutes: 5
    steps:
      # Full history: the diff is taken against the base branch, and
      # actions/checkout clones at depth 1 by default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # The guard is a CommonMark parser now (#936), so this leg has to have
      # one. It did not: this job was `actions/checkout` and a bare `python3`,
      # and the assembler was stdlib-only to match. Without the install the
      # check would report `skipped` on every pull request and exit non-zero —
      # a red leg that pins nothing, which is one step better than a green leg
      # that pins nothing and no more than that. Pinned by
      # `tests/test_changelog_fragment_parser_936.py`.
      - name: Install the CommonMark parser the fragment guard is
        run: python3 -m pip install --disable-pip-version-check markdown-it-py

      # Names must parse before anything else is claimed about them. This is
      # repo-wide, not diff-scoped: a fragment somebody else merged with a bad
      # name is a release that will refuse, and the PR that has to find out is
      # not the one cutting the tag.
      - name: Every fragment name and body parses
        run: python3 .github/scripts/assemble_changelog.py --check

      # Repo-wide and every PR, not at release time. The refs are the surface
      # a release leaves behind rather than one it reads, so the run that finds
      # them stale must not be the run cutting the tag (#918).
      - name: CHANGELOG.md's link refs agree with its release headings
        run: python3 .github/scripts/assemble_changelog.py --check-links

      - name: A user-visible change carries a fragment
        env:
          BASE: ${{ github.base_ref }}
          # The payload label set. Kept as the fallback the live read below
          # degrades to, and for that only — it is the set as it stood when the
          # run was CREATED, which is the whole of #1722.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE}...HEAD")
          if [ -z "$changed" ]; then
            echo "changelog   : skipped     (no files changed against origin/${BASE})"
            exit 0
          fi
          # Labels are read LIVE, not off the event payload (#1722). This job
          # prints `no-changelog` as its own escape hatch, and taking that
          # branch could not clear the PR: applying the label starts a fresh
          # run which passes, nothing removes the run that failed before the
          # label existed, and the merge gate is conjunctive over every run on
          # the head sha (#1640) — correctly so. Re-running did not help
          # either, because a re-run replays the payload the run was created
          # with. The only route out was pushing a commit, i.e. the documented
          # remedy could not clear the run printing it. Measured on #1721.
          #
          # The failing run was not wrong about anything it could see; it was
          # answering a question about a label set that no longer existed, and
          # rendering that as a `finding` is this repo's own defect class.
          # Reading live removes the stale input rather than reporting it.
          #
          # The cost, stated because it is real: the verdict is no longer
          # reproducible from the run's own payload, and a label REMOVED after
          # the run started now reddens it — which it must, or the escape hatch
          # outlives the decision to use it.
          # One label per line, never a joined string. A GitHub label name may
          # contain a comma, and `,${LABELS},` matched against `*,no-changelog,*`
          # cannot tell the label `wontfix,no-changelog` from the two labels
          # `wontfix` and `no-changelog` — so a single label nobody granted the
          # escape hatch to forged it. That ambiguity is unrecoverable on the
          # payload (Actions joins with a comma before the shell sees it) and
          # simply absent on the live read, which is one more reason to prefer
          # it. Applying a label needs write access, so this was never a fork-PR
          # hole; it was a hole for everyone with triage rights.
          labels="$(printf '%s' "$LABELS" | tr ',' '\n')"
          label_source=payload
          if [ -n "${PR_NUMBER:-}" ] && [ -n "${GH_REPO:-}" ]; then
            # The `pulls` endpoint and not `issues/{n}/labels`: a pull request
            # is an issue, but the scope that covers `/issues/*` for a
            # GITHUB_TOKEN is `issues: read`, and this job asks for
            # `pull-requests: read`. A permission mismatch here would 403 on
            # every run forever and land silently on the fallback arm — the
            # fix looking installed and never once working.
            #
            # Budgeted, because slow and down are different failures and only
            # one of them returns an error to fall back on. Before #1722 this
            # step made no network call at all; a degraded api.github.com would
            # otherwise sit here until `timeout-minutes: 5` cancelled the job —
            # red, receiptless, on every open PR at once. `timeout(1)` is GNU
            # coreutils: present on ubuntu-latest, absent from a stock macOS,
            # so it is used when present rather than assumed.
            if command -v timeout >/dev/null 2>&1; then
              read_cmd="timeout ${LABEL_READ_TIMEOUT:-30} gh"
            else
              read_cmd=gh
            fi
            if live=$($read_cmd api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.labels[].name' 2>/dev/null); then
              labels="$live"
              label_source=live
            else
              # The one arm allowed to degrade, and it degrades to exactly the
              # behaviour this job had before #1722: the payload. So it can
              # turn a finding into a skip and never the reverse — an outage,
              # a missing `gh`, or a token without the scope cannot redden a
              # board that was green yesterday. It says so rather than
              # answering as though it had read something, and the remedy it
              # prints below switches to the one that still works.
              echo "changelog   : note        (live label read failed - using this run's event payload; a label applied after this run started is invisible to it)"
            fi
          fi
          # Whole-line comparison, and a `while read` rather than
          # `grep -Fxq`: under `pipefail`, `grep -q` exits the moment it
          # matches, `printf` takes SIGPIPE, and the pipeline's status is 141 —
          # so the match reads as a miss precisely when it succeeds. A herestring
          # runs in this shell and has no pipeline to mis-status.
          has_label=0
          while IFS= read -r name; do
            if [ "$name" = no-changelog ]; then has_label=1; fi
          done <<< "$labels"
          if [ "$has_label" = 1 ]; then
            echo "changelog   : skipped     (label 'no-changelog' set on this PR - labels read ${label_source})"
            exit 0
          fi
          # `--name-only` alone lists a DELETION identically to an addition, so
          # until #925 a PR that *removed* somebody else's pending fragment
          # satisfied this gate: it announced nothing, dropped an
          # already-approved entry from the next release, and went green. The
          # two states have to be read apart, and that is two diffs rather than
          # one flag — restricting the single diff above to `AM` would also
          # stop the `shipped` read below seeing a DELETED preset, and a preset
          # that goes away is as user-visible as one that arrives.
          fragment_re='^changelog\.d/[0-9]+\.[a-z]+.*\.md$'
          added=$(git diff --name-only --diff-filter=AM "origin/${BASE}...HEAD" | grep -E "$fragment_re" || true)
          removed=$(git diff --name-only --diff-filter=D "origin/${BASE}...HEAD" | grep -E "$fragment_re" || true)
          # Deleting fragments is exactly what a release cut does — it folds
          # them into CHANGELOG.md and adds none — so that shape is a pass, and
          # is named as one rather than being waved through the branch below.
          # The test for it is "CHANGELOG.md was rewritten in the same PR",
          # which is a claim about the diff and not a proof the entries
          # survived; the assembler's own entry-balance refusal (#906) is what
          # proves that, and it runs where the file is written.
          assembled=$(printf '%s\n' "$changed" | grep -Fx 'CHANGELOG.md' || true)
          # Deliberately ABOVE the user-visible-paths gate below, and the
          # ordering is the finding rather than a detail. Losing a fragment
          # needs no code change to go with it: `git rm changelog.d/906.added.md`
          # on its own leaves `shipped` empty, and the first cut of this fix
          # therefore reported `skipped (nothing to announce)` and exited 0 on
          # the plainest instance of the very bug it closes. Found by the
          # independent review of that commit. The `no-changelog` label still
          # sits above this, because a label is a human saying "this announces
          # nothing" — which is a claim about what the PR adds, not a licence
          # to remove somebody else's entry, but it stays the single stated
          # escape hatch rather than growing a second one here.
          if [ -n "$removed" ] && [ -z "$assembled" ]; then
            echo "changelog   : finding     (fragment(s) deleted without being assembled into CHANGELOG.md)"
            printf '%s\n' "$removed" | sed 's/^/  deleted   /'
            echo "  fix       restore them — a pending entry is dropped from the next release, silently"
            echo "  or        if this is a release cut, it must also write CHANGELOG.md"
            exit 1
          fi
          # What a user could notice. Docs and tests are excluded on purpose:
          # requiring a fragment for a typo fix is how the discipline decays
          # into a reflex-added empty file.
          shipped=$(printf '%s\n' "$changed" | grep -E '^(_?supertool\.py|presets/|validators/|formatters/|notifiers/|\.claude-plugin/)' || true)
          if [ -z "$shipped" ]; then
            echo "changelog   : skipped     (no user-visible paths changed — nothing to announce)"
            exit 0
          fi
          if [ -z "$added" ]; then
            if [ -n "$removed" ]; then
              echo "changelog   : ok          (release: $(printf '%s\n' "$removed" | wc -l | tr -d ' ') fragment(s) assembled into CHANGELOG.md)"
              printf '%s\n' "$removed" | sed 's/^/  consumed  /'
              exit 0
            fi
            echo "changelog   : finding     (user-visible change with no changelog.d/ fragment)"
            echo "  changed   $(printf '%s\n' "$shipped" | head -5 | tr '\n' ' ')"
            echo "  fix       add changelog.d/<issue>.<section>.md — see docs/contributing.md"
            echo "  or        label the PR 'no-changelog' if it genuinely announces nothing"
            # The remedy names the mechanism THIS run actually used, because
            # the two mechanisms need different second steps and printing the
            # wrong one is #1722 itself. Labelling always starts a fresh run;
            # what the reader needs to know is how to clear the run in front
            # of them, which is the one that stays red on the head sha.
            if [ "$label_source" = live ]; then
              echo "  then      re-run this check - it reads the PR's labels live, so the re-run sees the new label"
            else
              echo "  then      push a commit - this run read its labels from the event payload, so a re-run replays the old set"
            fi
            exit 1
          fi
          echo "changelog   : ok          ($(printf '%s\n' "$added" | wc -l | tr -d ' ') fragment(s))"
          printf '%s\n' "$added" | sed 's/^/  /'
          # A PR that adds its own fragment and consumes others is legitimate
          # (a release that also carries an entry) and reached the line above
          # reporting only what it added. The deletions are half of what it
          # did, and a receipt that prints one half is the shape this whole
          # job exists to refuse.
          if [ -n "$removed" ]; then
            printf '%s\n' "$removed" | sed 's/^/  consumed  /'
          fi
